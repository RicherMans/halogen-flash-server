name: publish

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/entrypoint.sh"
      - "deploy/llama-swap-bridge.py"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-test the bridge
        run: python3 deploy/llama-swap-bridge.py --selftest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image ref
        run: |
          VER=$(sed -n 's/^FROM ghcr.io\/peonist-ai\/halogen-flash-server://p' Dockerfile)
          NS="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "NS=$NS" >> "$GITHUB_ENV"
          echo "IMAGE=$NS:$VER" >> "$GITHUB_ENV"
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      - name: Build
        run: docker build -f Dockerfile -t "$IMAGE" .

      - name: Push
        run: |
          docker push "$IMAGE"
          docker tag "$IMAGE" "$NS:latest"
          docker push "$NS:latest"