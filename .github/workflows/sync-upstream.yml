name: sync-upstream

on:
  schedule:
    # Daily at 04:23 UTC. Timers on a fork push to the default branch and run
    # this workflow; nothing happens when upstream has not moved.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Rebuild and push the image even if nothing changed"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/peonist-ai/halogen-flash-server.git
          git fetch upstream --tags

      # Merge upstream with -X theirs: whenever upstream touched a file this
      # fork also customizes, upstream's text wins and the fork ONLY re-applies
      # its llama-swap bridge (the single tracked file this fork edits). All
      # fork-only files (Dockerfile, workflows, the bridge) are not in upstream
      # and survive unchanged.
      - name: Merge upstream
        run: |
          N="$(git rev-list --count HEAD..upstream/main)"
          echo "NEED_SYNC=$([ "$N" -gt 0 ] && echo 1 || echo 0)" >> "$GITHUB_ENV"
          echo "upstream commits behind: $N"
          if [ "$N" -gt 0 ]; then
            git merge --no-edit -X theirs upstream/main
            if git diff --cached --name-only --diff-filter=U | grep -q .; then
              echo "sync: merge left unresolved paths; aborting" >&2
              git merge --abort
              exit 1
            fi
          fi

      - name: Re-apply the llama-swap bridge
        if: env.NEED_SYNC == '1'
        run: |
          python3 deploy/add-llama-swap-bridge.py
          bash -n deploy/entrypoint.sh

      # The fork image version is the newest upstream vX.Y.Z tag; Dockerfile is
      # the source of truth for it so publish.sh keeps working unchanged.
      - name: Bump the fork image version
        run: |
          CUR="$(sed -n 's/^FROM ghcr.io\/peonist-ai\/halogen-flash-server://p' Dockerfile)"
          NEW="$(git tag -l 'v*' | sed -n 's/^v//p' \
                 | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          echo "base ${CUR} -> ${NEW:-<none>}"
          if [ -n "$NEW" ] && [ "$NEW" != "$CUR" ]; then
            sed -i "s#^FROM ghcr.io/peonist-ai/halogen-flash-server:.*#FROM ghcr.io/peonist-ai/halogen-flash-server:$NEW#" Dockerfile
            echo "BUMPED=$([ "$NEW" != "$CUR" ] && echo 1 || echo 0)" >> "$GITHUB_ENV"
          else
            echo "BUMPED=0" >> "$GITHUB_ENV"
          fi

      - name: Verify
        run: |
          bash -n deploy/entrypoint.sh
          python3 deploy/add-llama-swap-bridge.py
          python3 deploy/llama-swap-bridge.py --selftest

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet; then
            VER="$(sed -n 's/^FROM ghcr.io\/peonist-ai\/halogen-flash-server://p' Dockerfile)"
            git add -A
            git commit -m "sync upstream ${VER}: merge and bump the fork image"
            git push origin main
            echo "PUSHED=1" >> "$GITHUB_ENV"
            echo "pushed main after syncing upstream ${VER}"
          else
            echo "PUSHED=0" >> "$GITHUB_ENV"
            echo "nothing to commit; working tree clean"
          fi

      - name: Log in to GHCR
        if: env.PUSHED == '1' || github.event.inputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the fork image
        if: env.PUSHED == '1' || github.event.inputs.publish == 'true'
        run: bash deploy/publish.sh